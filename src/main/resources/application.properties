server.port=8080
spring.application.name=hioas-upay

# ===== MySQL数据库配置 =====
spring.datasource.url=jdbc:mysql://localhost:13306/hioas_upay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===== MyBatis Flex配置 =====
mybatis-flex.mapper-scan=com.hioas.demo.mapper
mybatis-flex.bottom-line-fake-presence=false
mybatis-flex.rise-auto-client-packages=com.hioas.demo.mapper

# ===== 日志配置 =====
logging.level.com.hioas.demo=DEBUG
logging.level.org.springframework=INFO
logging.level.com.mybatisflex=INFO
logging.file.name=logs/hioas-upay.log

# ===== 支付平台业务配置 =====
pay.channel.health-check-interval=30
pay.global.max-attempts=3
pay.global.fallback-enabled=true
pay.reconciliation.cron=0 0 2 * * *
pay.encrypt.secret-key=!@#$%^&*()_+-=[]{}|;:',.<>?/ABCD1234
pay.sign-secret-seed=hioas_upay_2024_secure_seed
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
pay.auth.token-expire-seconds=86400
